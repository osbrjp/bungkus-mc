[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "syn@2", reason = "ratatui 0.30: strum/derive_more use syn 2, instability uses syn 3" },
    { crate = "hashbrown@0.16", reason = "ratatui 0.30: kasuari uses 0.16, lru uses 0.17" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
