[package]
name = "proto"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0"
crossterm = "0.29.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.release]
strip = true
